<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost your key? · Brim</title><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="page.css"><script src="config.js"></script></head>
<body><nav><div><a class="brand" href="index.html"><img src="img/badge-128.png" alt="">Brim</a><a href="index.html#get">Download</a></div></nav><main>
<h1>Lost your key?</h1><p class="updated">Last updated November 1, 2026</p>
<p>Enter the email you bought Brim with and we'll send your license key again.</p>
<div class="card"><form id="f"><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Anything else? (optional)<textarea name="note" rows="3" placeholder="Order number, approximate date…"></textarea></label><button type="submit">Send My Key</button></form></div>
<p style="margin-top:22px">Your key is also in your purchase receipt. Search your inbox for <b>“BRIM-”</b>.</p>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);location.href='mailto:'+BRIM.contactEmail+'?subject='+encodeURIComponent('Lost Brim license key')+'&body='+encodeURIComponent('Purchase email: '+d.get('email')+'\n\n'+(d.get('note')||''));};</script></main><footer><a href="index.html">Home</a><a href="terms.html">Terms</a><a href="refund.html">Refunds</a><a href="privacy.html">Privacy</a><a href="manage.html">Manage activation</a><a href="lost-key.html">Lost your key?</a><a class="mail" href="#">Contact</a></footer>
<script>document.querySelectorAll('.mail').forEach(a=>{a.href='mailto:'+BRIM.contactEmail; if(!a.textContent.trim()||a.dataset.show)a.textContent=BRIM.contactEmail;});</script></body></html>
